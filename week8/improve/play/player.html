<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keyboard play</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#111b1b;color:#e5efea}header{padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{background:#d6ebce;color:#182d28;border:0;border-radius:5px;padding:9px;cursor:pointer;font:inherit}#status{font-size:13px}canvas{display:block;width:100%;max-height:70vh;object-fit:contain;outline:none;cursor:pointer}canvas:focus{box-shadow:inset 0 0 0 2px #b6de89}p{margin:8px 12px;font-size:12px;line-height:1.65}#details{overflow-wrap:anywhere;color:#b6cebf}#legend{display:none}</style></head><body><header><button id="toggle" disabled>Loading…</button><button id="reset" disabled>Reset</button><span id="status" role="status">Reading the original code</span></header><canvas id="view" tabindex="0" aria-label="Click the court, then control with the keyboard"></canvas><div id="legend"></div><p>Arrows / WASD move · J forehand · K backhand · L serve · P pause · R reset</p><p id="details"></p><script src="player.js"></script></body></html>
